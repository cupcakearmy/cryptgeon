
services:
  cache:
    image: valkey/valkey:7-alpine
    # This is required to stay in RAM only.
    command: valkey-server --save "" --appendonly no
    # Set a size limit. See link below on how to customise.
    # https://valkey.io/docs/latest/operate/rs/databases/memory-performance/eviction-policy/
    # --maxmemory 1gb --maxmemory-policy allkeys-lrulpine
    # This prevents the creation of an anonymous volume.
    tmpfs:
      - /data

  app:
    image: cupcakearmy/cryptgeon:v3
    depends_on:
      - cache

  proxy:
    image: nginx:alpine
    depends_on:
      - app
    volumes:
      - ./nginx-plain.conf:/etc/nginx/conf.d/default.conf
      # Or with tls
      # - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
