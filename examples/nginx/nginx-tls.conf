# You should change the server_name to something sensible.
# Also you need to specify the path to the ssl certificates.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Enforce HTTPS
    return 301 https://$server_name$request_uri;
}

# Optional rate limiting - cryptgeon has no application-level rate limiting,
# so note creation can be abused to fill the cache. Requires a zone defined
# in the http block of nginx.conf, e.g.:
#   limit_req_zone $binary_remote_addr zone=cryptgeon:10m rate=10r/m;
# Then enable inside the server/location block:
#   limit_req zone=cryptgeon burst=20 nodelay;

server {
    listen 443      ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_trusted_certificate /path/to/fullchain.pem;

    location / {
      proxy_pass http://app:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
}
